<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الأسعار | أكاديمية أروى أشرف</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><style>body{background:#10182d;color:white;font:16px Tahoma,Arial;margin:0;padding:20px}main{max-width:960px;margin:auto}.box{background:#1b2944;padding:18px;border-radius:16px;margin:15px 0}h1,h2{color:#ffd37b}input,textarea,select,button{font:inherit;padding:11px;border-radius:9px;margin:5px 0;box-sizing:border-box}input,textarea,select{background:#2c3b5a;color:white;border:1px solid #586c91;width:100%}button{background:#7960dc;color:white;border:0;cursor:pointer}a{color:#ffd37b}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}small{color:#c5d3e8}#msg{white-space:pre-wrap}</style><main><a href="admin.html">← لوحة الإدارة</a><h1>💰 أسعار الحصص والسيشنات والكورسات</h1><div class="box"><h2>إضافة أو تعديل</h2><form id="form"><input type="hidden" id="itemId"><div class="row"><select id="kind"><option value="session">حصة / سيشن</option><option value="course">كورس كامل</option></select><input id="grade" required placeholder="الصف (بنفس كتابة صف الطالب)"></div><input id="title" required placeholder="عنوان الحصة أو الكورس"><textarea id="description" placeholder="وصف المحتوى"></textarea><div class="row"><input id="price" type="number" min="0" step="0.01" required placeholder="السعر بالجنيه - صفر للمجاني"><label><input id="active" type="checkbox" checked style="width:auto"> متاح للشراء</label></div><button>💾 حفظ السعر</button> <button type="button" id="clear">إلغاء التعديل</button></form><small>تغيير السعر يؤثر على الطلبات الجديدة فقط، وليس المشتريات السابقة.</small></div><div class="box" id="msg">جاري التحقق...</div><h2>الحصص والسيشنات</h2><div id="sessions"></div><h2>الكورسات</h2><div id="courses"></div><div class="box"><h2>ربط الدروس بالمحتوى</h2><small>اختر حصة أو كورسًا ثم اربط به الدروس الموجودة من نفس الصف. يمكن ربط عدة دروس بالكورس.</small><select id="itemSelect"></select><select id="lessonSelect"></select><button id="link">➕ ربط الدرس</button><button id="unlink">➖ إلغاء الربط</button><div id="links"></div></div><h2>طلبات الدفع</h2><button id="reload">تحديث الطلبات</button><div id="orders"></div></main><script>
const db=window.supabase.createClient('https://njyusmbeefzhvexlnncd.supabase.co','sb_publishable_Ns_oJAQml72d5GeBHpExow_dZHwp-vP'),$=id=>document.getElementById(id);let items=[],lessons=[],links=[];function el(t,s){const x=document.createElement(t);if(s!==undefined)x.textContent=s;return x}function box(title,desc){let x=el('div');x.className='box';x.append(el('h3',title),el('p',desc));return x}function err(e){$('msg').textContent=e.message||String(e)}function option(v,s){let x=el('option',s);x.value=v;return x}
async function init(){try{let u=await db.auth.getUser();if(!u.data.user){location.href='auth.html';return}let p=await db.from('profiles').select('account_type,approval_status').eq('id',u.data.user.id).single();if(p.error)throw p.error;if(p.data.account_type!=='admin'||p.data.approval_status!=='approved')throw Error('هذه الصفحة للإدارة المعتمدة فقط');$('msg').textContent='يمكنك تعديل الأسعار من هنا في أي وقت.';await load()}catch(e){err(e);$('form').hidden=true}}
async function load(){try{let [a,b,c,d]=await Promise.all([db.from('academy_items').select('*').order('created_at',{ascending:false}),db.from('lessons').select('id,title,grade'),db.from('academy_item_lessons').select('*'),db.from('academy_orders').select('*').order('created_at',{ascending:false})]);for(let r of [a,b,c,d])if(r.error)throw r.error;items=a.data;lessons=b.data;links=c.data;for(let kind of ['session','course']){let target=$(kind==='session'?'sessions':'courses');target.replaceChildren();for(let i of items.filter(x=>x.kind===kind)){let x=box(i.title,`${i.grade} | ${i.price_egp} جنيه | ${i.active?'متاح':'موقوف'}`),edit=el('button','✏️ تعديل السعر');edit.onclick=()=>{for(let k of ['kind','grade','title','description'])$(k).value=i[k];$('price').value=i.price_egp;$('active').checked=i.active;$('itemId').value=i.id;window.scrollTo({top:0,behavior:'smooth'})};x.append(edit);target.append(x)}}$('itemSelect').replaceChildren(...items.map(i=>option(i.id,`${i.title} — ${i.grade}`)));updateLessons();$('orders').replaceChildren();for(let o of d.data){let i=items.find(x=>x.id===o.item_id),x=box(i?.title||'محتوى',`طالب: ${o.student_id} | المبلغ وقت الطلب: ${o.price_at_order} جنيه | ${o.method} | مرجع: ${o.transfer_reference} | ${o.status}`),view=el('button','👁️ الإيصال');view.onclick=async()=>{let r=await db.storage.from('payment-receipts').createSignedUrl(o.receipt_path,120);if(r.error)return err(r.error);window.open(r.data.signedUrl,'_blank','noopener')};x.append(view);if(o.status==='pending'){let note=el('input');note.placeholder='ملاحظة اختيارية';x.append(note);for(let [v,label] of [[true,'✅ اعتماد بعد التأكد من الدفع'],[false,'❌ رفض']]){let btn=el('button',label);btn.onclick=async()=>{if(!confirm('هل تريد تنفيذ القرار؟'))return;btn.disabled=true;let r=await db.rpc('academy_review_order',{p_order_id:o.id,p_approve:v,p_note:note.value});if(r.error){err(r.error);btn.disabled=false}else await load()};x.append(btn)}}$('orders').append(x)}if(!d.data.length)$('orders').append(box('لا توجد طلبات','طلبات الطلاب ستظهر هنا'))}catch(e){err(e)}}
function updateLessons(){let i=items.find(x=>x.id===$('itemSelect').value);$('lessonSelect').replaceChildren(...lessons.filter(l=>l.grade===i?.grade).map(l=>option(l.id,l.title)));$('links').replaceChildren(...links.filter(x=>x.item_id===i?.id).map(x=>el('p','✔ '+(lessons.find(l=>l.id===x.lesson_id)?.title||x.lesson_id))))}
$('itemSelect').onchange=updateLessons;$('clear').onclick=()=>{$('form').reset();$('itemId').value=''};$('form').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{let r=await db.rpc('academy_save_item',{p_id:$('itemId').value||null,p_kind:$('kind').value,p_grade:$('grade').value,p_title:$('title').value,p_description:$('description').value,p_price:Number($('price').value),p_active:$('active').checked});if(r.error)throw r.error;$('msg').textContent='تم حفظ السعر بنجاح';$('clear').click();await load()}catch(e){err(e)}finally{b.disabled=false}};
for(let [id,yes] of [['link',true],['unlink',false]])$(id).onclick=async()=>{try{if(!$('lessonSelect').value)throw Error('لا توجد دروس لهذا الصف');let r=await db.rpc('academy_link_lesson',{p_item_id:$('itemSelect').value,p_lesson_id:$('lessonSelect').value,p_link:yes});if(r.error)throw r.error;await load()}catch(e){err(e)}};$('reload').onclick=load;init();
</script></html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | أكاديمية أروى أشرف</title>

<style>
:root {
  --navy:#10162d;
  --gold:#edc477;
  --purple:#9c6de1;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#10162d,#302047);
  color:white;
  font-family:Tahoma,Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.box {
  width:100%;
  max-width:430px;
  padding:28px;
  background:#192340;
  border:1px solid #edc47766;
  border-radius:22px;
  box-shadow:0 15px 45px #0005;
}
.logo {
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid var(--gold);
  display:block;
  margin:auto;
}
h1 {
  text-align:center;
  color:var(--gold);
  font-size:25px;
}
.subtitle {
  text-align:center;
  color:#c5c8db;
}
input,select {
  width:100%;
  padding:13px;
  margin:8px 0;
  background:#10162d;
  border:1px solid #ffffff44;
  border-radius:10px;
  color:white;
  font:inherit;
}
input:focus,select:focus {
  outline:2px solid var(--gold);
}
button {
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:11px;
  background:linear-gradient(120deg,#f9df9d,#c99a4e);
  color:#151a31;
  font:inherit;
  font-weight:bold;
  cursor:pointer;
}
button:disabled { opacity:.6; cursor:wait; }
.switch {
  text-align:center;
  margin-top:20px;
  color:#d8c4fa;
  cursor:pointer;
}
.hidden { display:none; }
.message {
  text-align:center;
  margin-top:15px;
  white-space:pre-line;
  overflow-wrap:anywhere;
}
a { color:var(--gold); }
.back { text-align:center; margin-top:20px; }
</style>
</head>

<body>

<div class="box">

<img src="assets/logo.jpg" class="logo" alt="شعار الأكاديمية">

<h1>أكاديمية أروى أشرف</h1>
<p class="subtitle" id="subtitle">إنشاء حساب جديد</p>

<form id="registerForm">

<input id="name" placeholder="الاسم بالكامل" required maxlength="120">

<input id="phone" type="tel" placeholder="رقم ولي الأمر أو رقم التواصل" required maxlength="30">

<select id="type" required>
<option value="student">طالب / ولي أمر</option>
<option value="teacher">معلم</option>
</select>

<select id="grade">
<option value="">اختر المرحلة التعليمية</option>
<option value="تأسيس أطفال">تأسيس أطفال</option>
<option value="الصف الأول الابتدائي">الصف الأول الابتدائي</option>
<option value="الصف الثاني الابتدائي">الصف الثاني الابتدائي</option>
<option value="الصف الثالث الابتدائي">الصف الثالث الابتدائي</option>
<option value="الصف الرابع الابتدائي">الصف الرابع الابتدائي</option>
<option value="الصف الخامس الابتدائي">الصف الخامس الابتدائي</option>
<option value="الصف السادس الابتدائي">الصف السادس الابتدائي</option>
<option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
<option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
<option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
<option value="تدريب المعلمين">تدريب المعلمين</option>
</select>

<input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>

<input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" minlength="6" autocomplete="new-password" required>

<button id="registerButton" type="submit">إنشاء الحساب</button>

</form>

<form id="loginForm" class="hidden">

<input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>

<input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>

<button id="loginButton" type="submit">تسجيل الدخول</button>

</form>

<div class="message" id="message" role="status" aria-live="polite"></div>

<div class="switch" id="switchMode">عندك حساب بالفعل؟ سجل دخول</div>

<div class="back">
<a href="index.html">← العودة للرئيسية</a>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL =
  "https://njyusmbeefzhvexlnncd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Ns_oJAQml72d5GeBHpExow_dZHwp-vP";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const registerForm = document.getElementById("registerForm");
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const switchMode = document.getElementById("switchMode");

let loginMode = false;

switchMode.onclick = () => {
  loginMode = !loginMode;

  registerForm.classList.toggle("hidden", loginMode);
  loginForm.classList.toggle("hidden", !loginMode);

  document.getElementById("subtitle").textContent =
    loginMode ? "تسجيل الدخول" : "إنشاء حساب جديد";

  switchMode.textContent = loginMode
    ? "ليس لديك حساب؟ إنشاء حساب"
    : "عندك حساب بالفعل؟ سجل دخول";

  message.textContent = "";
};

registerForm.onsubmit = async (event) => {
  event.preventDefault();

  const button = document.getElementById("registerButton");
  button.disabled = true;
  message.textContent = "جاري إنشاء الحساب...";

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await client.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: document.getElementById("name").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          account_type: document.getElementById("type").value,
          grade: document.getElementById("grade").value
        },
        emailRedirectTo:
          "https://tarekfangary4-tech.github.io/Arwa-Ashraf-Academy/auth.html"
      }
    });

    if (error) throw error;

    message.textContent =
      "تم إرسال طلب التسجيل.\nافتح بريدك الإلكتروني واضغط على رابط التأكيد.\nبعد التأكيد، انتظر موافقة إدارة الأكاديمية لتفعيل الاشتراك.";

  } catch (error) {
    message.textContent = "تعذر إنشاء الحساب: " + error.message;
  } finally {
    button.disabled = false;
  }
};

loginForm.onsubmit = async (event) => {
  event.preventDefault();

  const button = document.getElementById("loginButton");
  button.disabled = true;
  message.textContent = "جاري تسجيل الدخول...";

  try {
    const { data, error } = await client.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPassword").value
    });

    if (error) throw error;

    const { data: profile, error: profileError } = await client
      .from("profiles")
      .select("approval_status")
      .eq("id", data.user.id)
      .single();

    if (profileError) throw profileError;

    if (profile.approval_status === "pending") {
      message.textContent =
        "تم تسجيل الدخول بنجاح.\nحسابك في انتظار موافقة إدارة الأكاديمية.";
    } else if (profile.approval_status === "approved") {
      message.textContent =
        "أهلًا بك في أكاديمية أروى أشرف!\nتمت الموافقة على حسابك. لوحة الطالب قيد التجهيز.";
    } else {
      message.textContent =
        "حسابك غير مفعل حاليًا. تواصل مع إدارة الأكاديمية.";
    }

  } catch (error) {
    message.textContent =
      "تعذر تسجيل الدخول. تأكد من البريد الإلكتروني وكلمة المرور.";
  } finally {
    button.disabled = false;
  }
};
</script>

</body>
</html>

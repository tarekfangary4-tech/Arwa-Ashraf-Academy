<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10162d"><title>حسابي | أكاديمية أروى أشرف</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#10162d,#302047);color:#fff;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:20px}.box{width:100%;max-width:440px;padding:28px;background:#192340;border:1px solid #edc47766;border-radius:22px;box-shadow:0 15px 45px #0005}.logo{width:96px;height:96px;object-fit:cover;border-radius:50%;border:3px solid #edc477;display:block;margin:auto}h1{text-align:center;color:#edc477;font-size:25px}.subtitle{text-align:center;color:#c5c8db}input,select{width:100%;padding:13px;margin:8px 0;background:#10162d;border:1px solid #ffffff44;border-radius:10px;color:white;font:inherit}input:focus,select:focus{outline:2px solid #edc477}button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:11px;background:linear-gradient(120deg,#f9df9d,#c99a4e);color:#151a31;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.switch{text-align:center;margin-top:20px;color:#d8c4fa;cursor:pointer}.hidden{display:none}.message{text-align:center;margin-top:15px;white-space:pre-line;overflow-wrap:anywhere}a{color:#edc477}.back{text-align:center;margin-top:20px}
</style></head><body><div class="box"><img src="assets/logo.jpg" class="logo" alt="شعار الأكاديمية"><h1>أكاديمية أروى أشرف</h1><p class="subtitle" id="subtitle">إنشاء حساب جديد</p>
<form id="registerForm"><input id="name" placeholder="الاسم بالكامل" required maxlength="120" autocomplete="name"><input id="phone" type="tel" placeholder="رقم ولي الأمر أو رقم التواصل" required maxlength="30" autocomplete="tel"><select id="type"><option value="student">طالب / ولي أمر</option><option value="teacher">معلم</option></select><select id="grade"><option value="">اختر المرحلة التعليمية</option><option>تأسيس أطفال</option><option>الصف الأول الابتدائي</option><option>الصف الثاني الابتدائي</option><option>الصف الثالث الابتدائي</option><option>الصف الرابع الابتدائي</option><option>الصف الخامس الابتدائي</option><option>الصف السادس الابتدائي</option><option>الصف الأول الإعدادي</option><option>الصف الثاني الإعدادي</option><option>الصف الثالث الإعدادي</option><option>تدريب المعلمين</option></select><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required><input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" minlength="6" autocomplete="new-password" required><button id="registerButton" type="submit">إنشاء الحساب</button></form>
<form id="loginForm" class="hidden"><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required><input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" required><button id="loginButton" type="submit">تسجيل الدخول</button></form><div class="message" id="message" role="status" aria-live="polite"></div><div class="switch" id="switchMode" role="button" tabindex="0">عندك حساب بالفعل؟ سجل دخول</div><div class="back"><a href="index.html">← العودة للرئيسية</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const client=window.supabase.createClient('https://njyusmbeefzhvexlnncd.supabase.co','sb_publishable_Ns_oJAQml72d5GeBHpExow_dZHwp-vP');const registerForm=document.getElementById('registerForm'),loginForm=document.getElementById('loginForm'),message=document.getElementById('message'),switchMode=document.getElementById('switchMode');let loginMode=false;
function toggleMode(){loginMode=!loginMode;registerForm.classList.toggle('hidden',loginMode);loginForm.classList.toggle('hidden',!loginMode);document.getElementById('subtitle').textContent=loginMode?'تسجيل الدخول':'إنشاء حساب جديد';switchMode.textContent=loginMode?'ليس لديك حساب؟ إنشاء حساب':'عندك حساب بالفعل؟ سجل دخول';message.textContent=''}switchMode.onclick=toggleMode;switchMode.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMode()}};
registerForm.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('registerButton');btn.disabled=true;message.textContent='جاري إنشاء الحساب...';try{const {error}=await client.auth.signUp({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,options:{data:{full_name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),account_type:document.getElementById('type').value,grade:document.getElementById('grade').value},emailRedirectTo:'https://tarekfangary4-tech.github.io/Arwa-Ashraf-Academy/auth.html'}});if(error)throw error;message.textContent='تم إرسال طلب التسجيل.\nراجع بريدك الإلكتروني لتأكيد الحساب، ثم سجّل الدخول.\nالدروس المدفوعة تتطلب موافقة الإدارة واشتراكًا ساريًا.'}catch(err){message.textContent='تعذر إنشاء الحساب: '+err.message}finally{btn.disabled=false}};
loginForm.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('loginButton');btn.disabled=true;message.textContent='جاري تسجيل الدخول...';try{const {error}=await client.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(error)throw error;location.assign('dashboard.html')}catch(err){message.textContent='تعذر تسجيل الدخول. تأكد من البريد الإلكتروني وكلمة المرور وتأكيد البريد.';btn.disabled=false}};
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحصص والكورسات | أكاديمية أروى أشرف</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><style>body{background:#10182d;color:white;font:16px Tahoma,Arial;margin:0;padding:20px}main{max-width:800px;margin:auto}.box{background:#1b2944;padding:18px;border-radius:16px;margin:14px 0}h1,h2{color:#ffd37b}input,select,button{font:inherit;padding:12px;border-radius:9px;margin:5px 0;box-sizing:border-box;width:100%}input,select{background:#2c3b5a;color:white;border:1px solid #586c91}button{background:#7960dc;color:white;border:0}a{color:#ffd37b}small{color:#c5d3e8}#msg{white-space:pre-wrap}</style><main><a href="dashboard.html">← لوحة الطالب</a><h1>📚 الحصص والكورسات</h1><div class="box">كل حصة أو سيشن بسعر مستقل، والكورس له سعر كامل. المحتوى المجاني لا يحتاج تحويلًا. <b>لا تحول فلوس لأي رقم إلا بعد تأكيد بيانات الدفع من الأستاذة أروى.</b></div><div class="box" id="msg">جاري التحميل...</div><h2>🎥 الحصص والسيشنات</h2><div id="sessions"></div><h2>🎓 الكورسات الكاملة</h2><div id="courses"></div><h2>📩 طلباتي</h2><div id="orders"></div></main><script>
const db=window.supabase.createClient('https://njyusmbeefzhvexlnncd.supabase.co','sb_publishable_Ns_oJAQml72d5GeBHpExow_dZHwp-vP'),$=id=>document.getElementById(id);let user;function el(t,s){let x=document.createElement(t);if(s!==undefined)x.textContent=s;return x}function box(t,s){let x=el('div');x.className='box';x.append(el('h3',t),el('p',s));return x}function error(e){$('msg').textContent=e.message||String(e)}
async function init(){try{let r=await db.auth.getUser();user=r.data.user;if(!user){location.href='auth.html';return}let p=await db.from('profiles').select('grade,account_type,approval_status').eq('id',user.id).single();if(p.error)throw p.error;if(p.data.account_type!=='student'||p.data.approval_status==='rejected')throw Error('هذه الصفحة للطلاب فقط');$('msg').textContent='الصف: '+p.data.grade;await load()}catch(e){error(e)}}
async function load(){try{let [a,b,c]=await Promise.all([db.from('academy_items').select('*').eq('active',true),db.from('academy_orders').select('item_id,price_at_order,status,created_at').order('created_at',{ascending:false}),db.from('academy_access').select('item_id')]);for(let r of [a,b,c])if(r.error)throw r.error;for(let kind of ['session','course']){let target=$(kind==='session'?'sessions':'courses');target.replaceChildren();for(let i of a.data.filter(x=>x.kind===kind)){let owned=c.data.some(x=>x.item_id===i.id),pending=b.data.some(x=>x.item_id===i.id&&x.status==='pending'),card=box(i.title,`${i.grade} | ${i.price_egp===0?'مجاني':i.price_egp+' جنيه'}\n${i.description||''}`);if(i.price_egp===0||owned){card.append(el('strong',i.price_egp===0?'🆓 متاح مجانًا':'✅ تم الشراء — افتح دروسك من لوحة الطالب'))}else if(pending){card.append(el('strong','⏳ طلبك قيد المراجعة'))}else{let f=el('form'),method=el('select'),ref=el('input'),file=el('input'),btn=el('button','📤 إرسال إيصال الدفع');for(let [v,t] of [['vodafone_cash','فودافون كاش'],['instapay','إنستاباي']]){let o=el('option',t);o.value=v;method.append(o)}ref.placeholder='مرجع التحويل أو رقم المرسل';ref.required=true;file.type='file';file.accept='image/jpeg,image/png,image/webp,application/pdf';file.required=true;f.append(method,ref,file,btn);f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{let x=file.files[0];if(!x||x.size>10485760||!['image/jpeg','image/png','image/webp','application/pdf'].includes(x.type))throw Error('الإيصال صورة أو PDF حتى 10 ميجابايت');let ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'}[x.type],path=`receipts/${user.id}/${crypto.randomUUID()}.${ext}`;let up=await db.storage.from('payment-receipts').upload(path,x,{contentType:x.type,upsert:false});if(up.error)throw up.error;let r=await db.rpc('academy_order_item',{p_item_id:i.id,p_method:method.value,p_reference:ref.value,p_receipt:path});if(r.error)throw r.error;$('msg').textContent='تم إرسال طلبك للمراجعة';await load()}catch(e){error(e)}finally{btn.disabled=false}};card.append(f)}target.append(card)}if(!target.children.length)target.append(box('لا يوجد محتوى حاليًا','تابع الصفحة لاحقًا'))}$('orders').replaceChildren(...b.data.map(o=>box(a.data.find(i=>i.id===o.item_id)?.title||'طلب شراء',`${o.price_at_order} جنيه — ${o.status}`)))}catch(e){error(e)}}init();
</script></html>

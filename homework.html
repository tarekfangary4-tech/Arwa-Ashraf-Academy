<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>واجباتي | أكاديمية أروى أشرف</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><style>body{font-family:Tahoma,Arial;background:#0c1429;color:white;margin:0;padding:18px}main{max-width:850px;margin:auto}h1,h2{color:#f5c76a}.box{background:#172440;padding:20px;border-radius:16px;margin:16px 0}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border-radius:9px;background:#243654;color:white;border:1px solid #5a6381}button,.link{background:#8062e9;color:white;padding:11px 17px;border:0;border-radius:9px;cursor:pointer;display:inline-block;text-decoration:none;margin:4px}small{color:#cbd2e3}#msg{white-space:pre-wrap}</style></head><body><main><a class="link" href="dashboard.html">← لوحتي التعليمية</a><h1>📚 واجباتي</h1><p id="msg">جاري تحميل الواجبات...</p><div id="items"></div></main><script>
const URL='https://njyusmbeefzhvexlnncd.supabase.co',KEY='sb_publishable_Ns_oJAQml72d5GeBHpExow_dZHwp-vP';const db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let me=null;const mimeExt={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf','video/mp4':'mp4','video/webm':'webm'};
async function fileLink(path){const {data,error}=await db.storage.from('homework-files').createSignedUrl(path,120);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener')}
async function load(){try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('سجّل دخولك أولًا');me=user;const {data:p,error:pe}=await db.from('profiles').select('account_type,grade,approval_status').eq('id',user.id).single();if(pe||p?.account_type!=='student'||p?.approval_status==='rejected')throw Error('هذه الصفحة للطلاب المسجلين فقط');const {data:hs,error}=await db.from('homeworks').select('*').order('created_at',{ascending:false});if(error)throw error;const {data:subs,error:se}=await db.from('homework_submissions').select('*').eq('student_id',user.id);if(se)throw se;const byHomework=Object.fromEntries((subs||[]).map(s=>[s.homework_id,s]));$('items').replaceChildren();for(const h of hs||[]){const box=document.createElement('section');box.className='box';const title=document.createElement('h2');title.textContent=h.title;box.append(title);const d=document.createElement('p');d.textContent=h.description||'بدون تعليمات إضافية';box.append(d);const date=document.createElement('small');date.textContent='آخر موعد: '+(h.due_at?new Date(h.due_at).toLocaleString('ar-EG'):'مفتوح');box.append(date);if(h.attachment_path){const b=document.createElement('button');b.textContent='🎬📎 فتح شرح الواجب';b.onclick=()=>fileLink(h.attachment_path);box.append(b)}const s=byHomework[h.id];if(s){const p=document.createElement('p');p.textContent=s.score===null?'✅ تم التسليم — بانتظار التصحيح':'✅ الدرجة: '+s.score+'/100 — '+(s.feedback||'');box.append(p);if(s.attachment_path){const b=document.createElement('button');b.textContent='فتح الملف المرسل';b.onclick=()=>fileLink(s.attachment_path);box.append(b)}}else if(!h.due_at||new Date(h.due_at)>new Date()){const form=document.createElement('form');const txt=document.createElement('textarea');txt.placeholder='اكتب إجابتك هنا (اختياري عند رفع ملف)';txt.rows=4;txt.maxLength=10000;const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp,application/pdf,video/mp4,video/webm';const button=document.createElement('button');button.textContent='📤 تسليم الواجب';form.append(txt,file,button);form.onsubmit=async ev=>{ev.preventDefault();button.disabled=true;$('msg').textContent='جاري التسليم...';try{let path=null;const f=file.files[0];if(f){if(!mimeExt[f.type])throw Error('نوع الملف غير مدعوم');if(f.size>50*1024*1024)throw Error('الملف أكبر من 50 MB');path='students/'+me.id+'/'+crypto.randomUUID()+'.'+mimeExt[f.type];const {error}=await db.storage.from('homework-files').upload(path,f,{contentType:f.type,upsert:false});if(error)throw error}const {error}=await db.rpc('submit_homework',{p_homework_id:h.id,p_answer:txt.value.trim(),p_attachment:path});if(error)throw error;$('msg').textContent='✅ تم التسليم';await load()}catch(e){$('msg').textContent='تعذر التسليم: '+e.message}finally{button.disabled=false}};box.append(form)}else{const p=document.createElement('p');p.textContent='انتهى موعد التسليم';box.append(p)}$('items').append(box)}$('msg').textContent=hs?.length?'واجبات مرحلتك الدراسية':'لا توجد واجبات متاحة لمرحلتك حاليًا.'}catch(e){$('msg').textContent=e.message}}
load();
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الواجبات | أكاديمية أروى أشرف</title><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>window.addEventListener('error',e=>{const m=document.getElementById('msg');if(m)m.textContent='خطأ تحميل: '+e.message});window.addEventListener('unhandledrejection',e=>{const m=document.getElementById('msg');if(m)m.textContent='خطأ اتصال: '+(e.reason?.message||e.reason)});</script><style>body{font-family:Tahoma,Arial;background:#0c1429;color:white;margin:0;padding:18px}main{max-width:1000px;margin:auto}h1,h2{color:#f5c76a}.box{background:#172440;padding:20px;border-radius:16px;margin:16px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border-radius:9px;background:#243654;color:white;border:1px solid #5a6381}button,.link{background:#8062e9;color:white;padding:11px 17px;border:0;border-radius:9px;cursor:pointer;display:inline-block;text-decoration:none;margin:4px}small{color:#cbd2e3}.row{padding:12px;border-bottom:1px solid #586077}a{color:#f5c76a}#msg{white-space:pre-wrap}</style></head><body><main><a class="link" href="admin.html">← لوحة الإدارة</a><h1>📚 إدارة الواجبات</h1><p id="msg">جاري تشغيل الصفحة — نسخة إصلاح 2...</p><div id="app" hidden><section class="box"><h2>إضافة واجب</h2><form id="form"><label>العنوان</label><input id="title" required maxlength="180"><label>المرحلة (مطابقة تمامًا لمرحلة الطالب)</label><input id="grade" required list="grades"><datalist id="grades"><option value="الصف الأول الإعدادي"><option value="الصف الثاني الإعدادي"><option value="الصف الثالث الإعدادي"><option value="الصف الأول الثانوي"><option value="الصف الثاني الثانوي"><option value="الصف الثالث الثانوي"></datalist><label>الوصف / التعليمات</label><textarea id="desc" rows="4"></textarea><label>آخر موعد للتسليم (اختياري)</label><input id="due" type="datetime-local"><label>ملف شرح: صورة أو PDF أو فيديو (اختياري، حتى 50 MB)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,video/mp4,video/webm"><button id="save">نشر الواجب</button></form></section><section class="box"><h2>الواجبات والتسليمات</h2><button id="refresh">تحديث</button><div id="items"></div></section></div></main><script>
const URL='https://njyusmbeefzhvexlnncd.supabase.co',KEY='sb_publishable_Ns_oJAQml72d5GeBHpExow_dZHwp-vP';let db;const $=id=>document.getElementById(id);const say=t=>$('msg').textContent=t;
async function init(){try{say('جاري الاتصال بالخادم… (نسخة إصلاح 2)');if(!window.supabase)throw Error('مكتبة Supabase لم تُحمّل. تحقق من الإنترنت أو مانع الإعلانات');db=window.supabase.createClient(URL,KEY); const timeout=ms=>new Promise((_,reject)=>setTimeout(()=>reject(Error('انتهت مهلة الاتصال. تحقق من الإنترنت ثم حدّث الصفحة')),ms));const {data:{user},error:authError}=await Promise.race([db.auth.getUser(),timeout(12000)]);if(authError)throw authError;if(!user)throw Error('سجّل دخولك أولًا');const {data:p,error}=await Promise.race([db.from('profiles').select('account_type,approval_status').eq('id',user.id).single(),timeout(12000)]);if(error)throw error;if(p?.account_type!=='admin'||p?.approval_status!=='approved')throw Error('هذه الصفحة للإدارة المعتمدة فقط');$('app').hidden=false;say('جاهز لإدارة الواجبات');await refresh()}catch(e){say(e.message)}}
const mimeExt={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf','video/mp4':'mp4','video/webm':'webm'};
async function upload(file,prefix){if(!mimeExt[file.type])throw Error('نوع الملف غير مدعوم');if(file.size>50*1024*1024)throw Error('الملف أكبر من 50 MB');const name=prefix+'/'+crypto.randomUUID()+'.'+mimeExt[file.type];const {error}=await db.storage.from('homework-files').upload(name,file,{contentType:file.type,upsert:false});if(error)throw error;return name}
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;say('جاري الحفظ...');try{let path=null;if($('file').files[0])path=await upload($('file').files[0],'teachers');const due=$('due').value?new Date($('due').value).toISOString():null;const {error}=await db.from('homeworks').insert({title:$('title').value.trim(),grade:$('grade').value.trim(),description:$('desc').value.trim(),due_at:due,is_free:true,attachment_path:path});if(error)throw error;$('form').reset();say('✅ تم نشر الواجب');await refresh()}catch(e){say('تعذر الحفظ: '+e.message)}finally{$('save').disabled=false}};
async function openFile(path){const {data,error}=await db.storage.from('homework-files').createSignedUrl(path,120);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener')}
async function refresh(){const {data:hs,error}=await db.from('homeworks').select('*').order('created_at',{ascending:false});if(error){say(error.message);return}const {data:subs,error:se}=await db.from('homework_submissions').select('*').order('submitted_at',{ascending:false});if(se){say(se.message);return}const ids=[...new Set((subs||[]).map(s=>s.student_id))];let profiles=[];if(ids.length){const res=await db.from('profiles').select('id,full_name').in('id',ids);profiles=res.data||[]}const names=Object.fromEntries(profiles.map(p=>[p.id,p.full_name]));$('items').replaceChildren();for(const h of hs||[]){const box=document.createElement('div');box.className='row';const title=document.createElement('h3');title.textContent=h.title+' — '+h.grade;box.append(title);const meta=document.createElement('small');meta.textContent='التسليم حتى: '+(h.due_at?new Date(h.due_at).toLocaleString('ar-EG'):'بدون موعد');box.append(meta);if(h.attachment_path){const b=document.createElement('button');b.textContent='📎 فتح شرح الواجب';b.onclick=()=>openFile(h.attachment_path);box.append(b)}const del=document.createElement('button');del.textContent='حذف الواجب';del.onclick=async()=>{if(!confirm('حذف الواجب وتسليماته؟'))return;const {error}=await db.from('homeworks').delete().eq('id',h.id);if(error)alert(error.message);else refresh()};box.append(del);const rows=(subs||[]).filter(s=>s.homework_id===h.id);const p=document.createElement('p');p.textContent='عدد التسليمات: '+rows.length;box.append(p);for(const s of rows){const r=document.createElement('div');r.className='row';const name=document.createElement('strong');name.textContent=names[s.student_id]||s.student_id;r.append(name);const answer=document.createElement('p');answer.textContent='الإجابة: '+(s.answer_text||'ملف فقط');r.append(answer);if(s.attachment_path){const b=document.createElement('button');b.textContent='📎 فتح تسليم الطالب';b.onclick=()=>openFile(s.attachment_path);r.append(b)}const note=document.createElement('small');note.textContent=s.score===null?'بانتظار التصحيح':'الدرجة: '+s.score+'/100 — '+(s.feedback||'');r.append(note);const grade=document.createElement('button');grade.textContent='✍️ تصحيح';grade.onclick=async()=>{const score=prompt('الدرجة من 100:',s.score??'');if(score===null)return;const n=Number(score);if(!Number.isFinite(n)||n<0||n>100)return alert('درجة غير صحيحة');const feedback=prompt('ملاحظات الأستاذة:',s.feedback||'');if(feedback===null)return;const {error}=await db.rpc('grade_homework',{p_submission_id:s.id,p_score:n,p_feedback:feedback});if(error)alert(error.message);else refresh()};r.append(grade);box.append(r)}$('items').append(box)}if(!hs?.length)$('items').textContent='لا توجد واجبات بعد.'}
$('refresh').onclick=refresh;window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{if($('msg').textContent.includes('جاري'))say('تأخر التحقق؛ تأكد من الاتصال وأعد تحميل الصفحة');},18000);init()});
</script></body></html>
